<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وهم | اتاق‌خواب</title>
<script>
  // Coming from the falling video: start fully black, then fade the room in slowly
  try {
    if (sessionStorage.getItem('vahm_from_fall') === '1') {
      document.documentElement.classList.add('from-fall');
    }
  } catch (e) {}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #05050a;
    font-family: Tahoma, sans-serif;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05050a;
  }

  .room-wrap {
    position: relative;
    width: 100%;
    max-width: min(1500px, calc(100vh * 2.1219));
    aspect-ratio: 1827 / 861;
  }

  .room-img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    filter: brightness(1);
    transition: filter 0.8s ease;
  }

  .room-wrap.dark .room-img {
    filter: brightness(0.15) contrast(1.1);
  }

  .hotspot {
    position: absolute;
    cursor: pointer;
    background: transparent;
    transition: background 0.3s ease, box-shadow 0.3s ease;
    border-radius: 12px;
  }

  .hotspot:hover {
    background: rgba(255, 220, 150, 0.12);
    box-shadow: 0 0 25px rgba(255, 220, 150, 0.25) inset;
  }

  .hotspot--desk {
    left: 5%;
    top: 58%;
    width: 46%;
    height: 39%;
  }

  .hotspot--window {
    left: 56%;
    top: 2%;
    width: 31%;
    height: 56%;
  }

  .handle-icon {
    position: absolute;
    left: 82%;
    top: 27%;
    width: 26px;
    height: 26px;
    cursor: pointer;
    z-index: 4;
    transition: transform 0.25s ease, filter 0.25s ease;
  }
  .handle-icon:hover {
    transform: scale(1.25);
    filter: drop-shadow(0 0 10px rgba(150,200,255,0.7));
  }
  .handle-icon svg { width: 100%; height: 100%; }

  .hotspot--lamp {
    left: 59%;
    top: 42%;
    width: 7%;
    height: 25%;
    border-radius: 50%;
  }
  .hotspot--lamp:hover {
    background: rgba(255, 230, 180, 0.2);
    box-shadow: 0 0 30px rgba(255, 230, 180, 0.4) inset;
  }

  .fact-card {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    max-width: 60%;
    padding: 28px 34px;
    background: rgba(20, 18, 14, 0.55);
    border: 1px solid rgba(230, 210, 170, 0.35);
    border-radius: 6px;
    color: #f2e6cf;
    font-size: 1.05rem;
    line-height: 1.9;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease, transform 0.9s ease;
    backdrop-filter: blur(2px);
    box-shadow: 0 0 40px rgba(255, 220, 160, 0.15);
  }

  .fact-card.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .fact-card::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px dashed rgba(230, 210, 170, 0.25);
    border-radius: 4px;
    pointer-events: none;
  }

  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 14, 20, 0.85);
    color: #f2e6cf;
    padding: 14px 26px;
    border-radius: 30px;
    border: 1px solid rgba(230, 210, 170, 0.3);
    font-size: 0.95rem;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
    letter-spacing: 0.5px;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .hint {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(242, 230, 207, 0.55);
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  .intro-fade {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 300;
  }
  html.from-fall .intro-fade { opacity: 1; }
  html.from-fall .intro-fade.go {
    opacity: 0;
    transition: opacity 3.6s ease-in-out;
  }

  .eyelid {
    position: fixed;
    left: 0; right: 0;
    background: #05050a;
    z-index: 200;
    pointer-events: none;
  }
  .eyelid-top { top: 0; height: 50%; transform: translateY(-100%); }
  .eyelid-bottom { bottom: 0; height: 50%; transform: translateY(100%); }
  .eyelid.closing.eyelid-top { animation: closeTop 0.55s ease forwards; }
  .eyelid.closing.eyelid-bottom { animation: closeBottom 0.55s ease forwards; }
  @keyframes closeTop { to { transform: translateY(0); } }
  @keyframes closeBottom { to { transform: translateY(0); } }
  .eyelid.opening.eyelid-top { animation: openTop 0.6s ease forwards; }
  .eyelid.opening.eyelid-bottom { animation: openBottom 0.6s ease forwards; }
  @keyframes openTop { from { transform: translateY(0); } to { transform: translateY(-100%); } }
  @keyframes openBottom { from { transform: translateY(0); } to { transform: translateY(100%); } }

  /* ---- papers flutter (cut-outs of the room picture, animated by code) ---- */
  .papers-layer { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: filter 0.8s ease; }
  .papers-layer.on { opacity: 1; }
  .window-layer { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: filter 0.8s ease; }
  .window-layer.on { opacity: 1; }
  .room-wrap.dark .window-layer { filter: brightness(0.15) contrast(1.1); }
  .window-layer img { position: absolute; display: block; will-change: transform; }
  .handle-icon { will-change: rotate; }
  .room-wrap.dark .papers-layer { filter: brightness(0.15) contrast(1.1); }
  .papers-layer img { position: absolute; display: block; will-change: transform; image-rendering: auto; }
  .papers-layer .patch { z-index: 0; }
  .papers-layer .sprite { z-index: 1; }
  .hotspot--papers-table { left: 10%; top: 62%; width: 36%; height: 11%; z-index: 3; }
  .hotspot--papers-wall  { left: 17%; top: 31%; width: 15%; height: 22%; z-index: 3; }
  .hotspot--papers-table:hover, .hotspot--papers-wall:hover { background: transparent; box-shadow: none; }
</style>
</head>
<body>

<div class="intro-fade" id="introFade"></div>
<div class="eyelid eyelid-top" id="eyelidTop"></div>
<div class="eyelid eyelid-bottom" id="eyelidBottom"></div>

<div class="scene">
  <div class="hint">روی میز، پنجره، دستگیره‌ی پنجره یا آباژور کلیک کن</div>

  <div class="room-wrap" id="roomWrap">
    <img class="room-img" src="room.jpg" alt="اتاق‌خواب وهم" />
    <div class="papers-layer" id="papersLayer"></div>
    <div class="window-layer" id="windowLayer"></div>

    <div class="hotspot hotspot--desk" id="deskHotspot" title="میز"></div>
    <div class="hotspot hotspot--papers-table" data-papers title="کاغذها"></div>
    <div class="hotspot hotspot--papers-wall" data-papers title="کاغذها"></div>
    <div class="hotspot hotspot--window" id="windowHotspot" title="پنجره"></div>
    <div class="handle-icon" id="handleHotspot" title="دستگیره‌ی پنجره">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="10" fill="none" stroke="#cbb98a" stroke-width="2.2"/>
        <circle cx="20" cy="20" r="3" fill="#cbb98a"/>
        <line x1="20" y1="10" x2="20" y2="4" stroke="#cbb98a" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="hotspot hotspot--lamp" id="lampHotspot" title="آباژور"></div>

    <div class="fact-card" id="factCard"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="vahm-music.js"></script>
<script>
  const facts = [
    "در طول یک شب، انسان معمولاً بین ۴ تا ۶ خواب می‌بیند، حتی اگر هیچ‌کدام را به‌خاطر نیاورد.",
    "بیشتر خواب‌ها در مرحله‌ی REP خواب (حرکت سریع چشم) اتفاق می‌افتند.",
    "افراد نابینا از بدو تولد هم خواب می‌بینند، اما بدون تصویر بصری، با حس‌های دیگر.",
    "میانگین یک خواب معمولاً بین ۵ تا ۲۰ دقیقه طول می‌کشد.",
    "حیوانات هم خواب می‌بینند؛ اسکن مغزی موش‌ها الگوهای مشابه انسان در خواب REM نشان داده.",
    "حدود ۹۵ درصد خواب‌ها ظرف چند دقیقه پس از بیدار شدن فراموش می‌شوند.",
    "پدیده‌ی 'خواب شفاف' (Lucid Dream) زمانی‌ست که فرد در حین خواب دیدن، متوجه می‌شود در حال خواب دیدن است."
  ];

  let lampOn = true;
  const roomWrap = document.getElementById('roomWrap');
  const factCard = document.getElementById('factCard');
  const toast = document.getElementById('toast');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  document.getElementById('lampHotspot').addEventListener('click', () => {
    lampOn = !lampOn;
    if (!lampOn) {
      roomWrap.classList.add('dark');
      const fact = facts[Math.floor(Math.random() * facts.length)];
      factCard.textContent = fact;
      setTimeout(() => factCard.classList.add('show'), 400);
    } else {
      factCard.classList.remove('show');
      roomWrap.classList.remove('dark');
    }
  });

  const eyelidTop = document.getElementById('eyelidTop');
  const eyelidBottom = document.getElementById('eyelidBottom');

  function blinkTo(url) {
    eyelidTop.classList.add('closing');
    eyelidBottom.classList.add('closing');
    setTimeout(() => { window.location.href = url; }, 520);
  }

  const fromFall = document.documentElement.classList.contains('from-fall');

  // keep the ambient music going from the previous page (slow fade-in while the room appears)
  if (!VahmMusic.resume(5)) VahmMusic.start({ fadeIn: 5 });   // also starts (on first click if the browser blocks autoplay) when this page is opened directly

  window.addEventListener('DOMContentLoaded', () => {
    if (fromFall) return; // slow fade-in is handled below instead of the quick eyelid opening
    eyelidTop.classList.add('opening');
    eyelidBottom.classList.add('opening');
  });

  if (fromFall) {
    try { sessionStorage.removeItem('vahm_from_fall'); } catch (e) {}
    // wait until the room image is loaded, then fade in slowly from black
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('introFade').classList.add('go');
      }, 400);
    });
  }

  document.getElementById('deskHotspot').addEventListener('click', () => {
    blinkTo('desk.html');
  });

  const papersLayer = document.getElementById('papersLayer');
  const windowLayer = document.getElementById('windowLayer');
  const BREEZE_COOLDOWN = 30000, WINDOW_COOLDOWN = 20000;   // ms between two plays
  let lastBreeze = -Infinity, breezePlaying = false, lastWindow = -Infinity, windowPlaying = false;

  // every layer is cut from room.jpg itself and placed in its own pixel coordinates (PD.W x PD.H),
  // so at rest the picture is identical to the original; only the moving parts are drawn on top.
  const place = (el, d) => {
    el.style.left = (d.x / PD.W * 100) + '%'; el.style.top = (d.y / PD.H * 100) + '%';
    el.style.width = (d.w / PD.W * 100) + '%'; el.style.height = (d.h / PD.H * 100) + '%';
  };
  PD.patches.forEach(d => {
    const el = new Image(); el.src = d.src; el.className = 'patch'; place(el, d); papersLayer.appendChild(el);
  });
  const sprites = PD.sprites.map(d => {
    const el = new Image(); el.src = d.src; el.className = 'sprite'; place(el, d);
    el.style.transformOrigin = d.kind === 'w' ? '50% 6%' : '50% 50%';
    papersLayer.appendChild(el);
    return { el, d, cx: (d.x + d.w / 2) / PD.W };
  });

  // ---- sound <-> animation sync ----
  // The audio element's own clock (currentTime) drives every frame of the animation, so picture and sound
  // can never drift apart. If the browser refuses to play the sound, the same timeline runs silently.
  function runWithSound(audio, duration, frame, done) {
    let useAudio = false, t0 = 0, finished = false;
    const fin = () => { if (finished) return; finished = true; done(); };
    const loop = () => {
      if (finished) return;
      const t = useAudio ? audio.currentTime : (performance.now() - t0) / 1000;
      if (t >= duration - 0.005 || (useAudio && audio.ended)) { frame(duration); fin(); return; }
      frame(t); requestAnimationFrame(loop);
    };
    try {
      audio.currentTime = 0;
      const p = audio.play();
      const go = ok => { useAudio = ok; t0 = performance.now(); requestAnimationFrame(loop); };
      if (p && p.then) p.then(() => go(true), () => go(false)); else go(true);
    } catch (e) { t0 = performance.now(); requestAnimationFrame(loop); }
  }
  const sample = (arr, fps, t) => {            // linear interpolation of a pre-computed curve
    const f = Math.max(0, t) * fps, i = Math.floor(f);
    if (i >= arr.length - 1) return arr[arr.length - 1];
    return arr[i] + (arr[i + 1] - arr[i]) * (f - i);
  };

  // ---- papers: motion strength follows the loudness of the real rustle recording ----
  const rustleAudio = new Audio('room-rustle.mp3'); rustleAudio.preload = 'auto'; rustleAudio.volume = 0.6;

  function playBreeze() {
    if (breezePlaying || Date.now() - lastBreeze < BREEZE_COOLDOWN) return;
    breezePlaying = true;
    const sc = roomWrap.clientWidth / PD.W, R = (a, b) => a + Math.random() * (b - a);
    const sgn = () => (Math.random() < 0.5 ? -1 : 1);
    sprites.forEach(s => {                           // every play is different
      s.lag = Math.max(0, s.cx - 0.1) * 0.35;        // a gust travels left -> right
      s.f1 = R(1.8, 3.2); s.f2 = R(1.2, 2.5); s.p1 = R(0, 6.28); s.p2 = R(0, 6.28);
      s.lift = R(2, 4); s.dx = sgn() * R(1, 2.5); s.rz = sgn() * R(0.8, 2); s.rx = sgn() * R(5, 10); s.ry = sgn() * R(4, 8);
    });
    papersLayer.classList.add('on');
    runWithSound(rustleAudio, FX.paper.dur, t => {
      sprites.forEach(s => {
        const e = t >= FX.paper.dur ? 0 : sample(FX.paper.env, FX.paper.fps, t - s.lag);   // 0 when silent -> paper rests in place
        if (e < 0.002) { s.el.style.transform = ''; s.el.style.filter = ''; return; }
        const a = Math.sin(s.f1 * t * 6.283 + s.p1), b = Math.sin(s.f2 * t * 6.283 + s.p2);
        if (s.d.kind === 'w') {                                   // pinned papers sway from their pins
          s.el.style.transform = `perspective(${900 * sc}px) rotateZ(${e * 1.4 * a}deg) rotateY(${e * 7 * b}deg) rotateX(${e * 2 * a}deg)`;
        } else {                                                  // desk papers lift and flutter slightly
          s.el.style.transform = `perspective(${700 * sc}px) translate(${e * s.dx * sc * b}px, ${-e * s.lift * sc}px) rotateZ(${e * s.rz * a}deg) rotateX(${e * s.rx * (0.6 + 0.4 * b)}deg) rotateY(${e * s.ry * a}deg)`;
          s.el.style.filter = `drop-shadow(0 ${e * 3 * sc}px ${e * 3 * sc}px rgba(0,0,0,${(0.45 * e).toFixed(2)}))`;
        }
      });
    }, () => {
      sprites.forEach(s => { s.el.style.transform = ''; s.el.style.filter = ''; });
      papersLayer.classList.remove('on'); breezePlaying = false; lastBreeze = Date.now();
    });
  }

  // ---- window: the right sash is tried (handle rattles, it pushes open, hesitates, swings back and knocks shut) ----
  const nightEl = new Image(); nightEl.src = SASH.night; nightEl.className = 'night'; place(nightEl, SASH); windowLayer.appendChild(nightEl);
  const sashEl = new Image(); sashEl.src = SASH.sash; sashEl.className = 'sash'; place(sashEl, SASH);
  sashEl.style.transformOrigin = '100% 50%';       // hinged on the right, next to the handle
  windowLayer.appendChild(sashEl);
  const handleEl = document.getElementById('handleHotspot');
  const windowAudio = new Audio(FX.win.snd); windowAudio.preload = 'auto'; windowAudio.volume = 0.7;

  function playWindow() {
    if (windowPlaying || Date.now() - lastWindow < WINDOW_COOLDOWN) return;
    windowPlaying = true;
    const sc = roomWrap.clientWidth / PD.W;
    windowLayer.classList.add('on');
    runWithSound(windowAudio, FX.win.dur, t => {
      const ang = t >= FX.win.dur ? 0 : sample(FX.win.ang, FX.win.fps, t);
      const hd = t >= FX.win.dur ? 0 : sample(FX.win.hdl, FX.win.fps, t);
      sashEl.style.transform = `perspective(${1500 * sc}px) rotateY(${ang * 2.6}deg)`;
      handleEl.style.rotate = hd + 'deg';
    }, () => {
      sashEl.style.transform = ''; handleEl.style.rotate = '';
      windowLayer.classList.remove('on'); windowPlaying = false; lastWindow = Date.now();
    });
  }
  document.querySelectorAll('[data-papers]').forEach(el => {
    el.addEventListener('pointerenter', playBreeze);   // staying on the papers never repeats it
    el.addEventListener('click', () => blinkTo('desk.html'));
  });

  document.getElementById('windowHotspot').addEventListener('pointerenter', playWindow);   // staying on the window never repeats it
  document.getElementById('windowHotspot').addEventListener('click', () => {
    blinkTo('constellation.html');
  });

  document.getElementById('handleHotspot').addEventListener('click', (e) => {
    e.stopPropagation();
    blinkTo('public.html');
    showToast('→ فضای عمومی همه‌ی خواب‌ها (دستگیره)');
  });
</script>

</body>
</html>
