<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وهم | Vahm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    background: radial-gradient(ellipse at center, #1a1f3a 0%, #05070f 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Tahoma, sans-serif;
    color: #f2e9d8;
  }

  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 80% 20%, #fff, transparent),
      radial-gradient(1px 1px at 35% 80%, #fff, transparent),
      radial-gradient(2px 2px at 90% 50%, #fff, transparent),
      radial-gradient(1px 1px at 10% 60%, #fff, transparent),
      radial-gradient(1px 1px at 50% 15%, #fff, transparent),
      radial-gradient(2px 2px at 70% 90%, #fff, transparent);
    background-repeat: repeat;
    background-size: 100% 100%;
    opacity: 0.7;
    animation: twinkle 4s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 0.9; }
  }

  h1 {
    font-size: 4rem;
    letter-spacing: 0.3rem;
    z-index: 1;
    text-shadow: 0 0 20px rgba(242, 233, 216, 0.5);
    animation: floatTitle 6s ease-in-out infinite;
  }

  p {
    z-index: 1;
    margin-top: 0.5rem;
    font-style: italic;
    color: #9aa0b8;
    letter-spacing: 0.2rem;
  }

  @keyframes floatTitle {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <h1>وهم</h1>
  <p>Vahm</p>
</body>
</html>
